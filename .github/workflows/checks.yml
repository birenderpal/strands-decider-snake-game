name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Use the macOS wheels already used for local validation. The standard Linux
    # PyTorch distribution pulls CUDA runtimes that these model-free tests do not use.
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.7.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test rules, model boundary, and API
        run: uv run --locked pytest -q
      - name: Check Python style
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Check whitespace
        run: git show --format= --check HEAD
